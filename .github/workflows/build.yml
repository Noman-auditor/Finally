name: Build NORA TUNNEL

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SING_BOX_TAG: v1.14.2
    steps:
      - uses: actions/checkout@v4

      # AGP 8.7.x needs JDK 17+. The "version-check" plugin error means this or Gradle was too old.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repo has no gradle-wrapper.jar, so install Gradle directly (AGP 8.7.x needs Gradle >= 8.9).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Install Android SDK pieces
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # Building the real sing-box core takes several minutes, so cache the result.
      - name: Cache libbox.aar
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ env.SING_BOX_TAG }}-${{ hashFiles('scripts/build-libbox.sh') }}

      - name: Build libbox.aar
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-libbox.sh "$SING_BOX_TAG"

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee gradle-build.log

      # On failure, put just the compiler errors on the run's Summary page so they are easy to copy.
      - name: Show compile errors
        if: failure()
        run: |
          {
            echo '### Compiler errors'
            echo '```'
            grep -E '^e: |error:|What went wrong' -A2 gradle-build.log | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-build-log
          path: gradle-build.log

      - uses: actions/upload-artifact@v4
        with:
          name: nora-tunnel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
